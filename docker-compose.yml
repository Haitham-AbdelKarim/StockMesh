services:
  api:
    build:
      context: .
      dockerfile: Api/Dockerfile
    container_name: stockmesh-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Forecasting__BaseUrl=http://forecasting-service:8000
    depends_on:
      - sqlserver
      - redis
      - forecasting-service

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: stockmesh-sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=StockMeshPassw0rd!
    volumes:
      - sqlserver-data:/var/opt/mssql

  redis:
    image: redis:8.6-alpine
    container_name: stockmesh-redis
    ports:
      - "6379:6379"

  forecasting-service:
    build:
      context: ./forecasting-service
    container_name: stockmesh-forecasting
    ports:
      - "8000:8000"

volumes:
  sqlserver-data: